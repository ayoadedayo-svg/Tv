<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dumbtv — launch (fast)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script type="module">
import { drawFrame3, init3 } from './src/film3.js';

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false });

const load = (src) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = reject;
  img.src = src;
});

const images = {};
await Promise.all([
  document.fonts.load('400 100px Georgia'),
  document.fonts.load('300 100px "Helvetica Neue"'),
  document.fonts.load('400 100px "Helvetica Neue"'),
  document.fonts.load('500 100px "Helvetica Neue"'),
  document.fonts.load('400 20px "Geist Mono"'),
  document.fonts.load('500 20px "Geist Mono"'),
]);
await document.fonts.ready;
images.home = await load('./assets/home.png');
init3();

window.__frame = (t) => { drawFrame3(ctx, t, images); return true; };
window.__ready = true;
const params = new URLSearchParams(location.search);
if (params.has('t')) window.__frame(parseFloat(params.get('t')));
</script>
</body>
</html>
