<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { drawFrame4, init4 } from './src/film4.js';

const ctx = document.getElementById('c').getContext('2d');
const load = (src) =>
  new Promise((res) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = src;
  });

const images = {
  launcher: await load('./assets/launcher-clean.png'),
  shorts: await load('./assets/shorts-setting.png'),
  smarttube: await load('./assets/smarttube-home.png'),
};

await Promise.all([
  document.fonts.load('400 100px "Helvetica Neue"'),
  document.fonts.load('500 100px "Helvetica Neue"'),
  document.fonts.load('400 20px "Geist Mono"'),
  document.fonts.load('500 20px "Geist Mono"'),
]);
await document.fonts.ready;

init4();
window.__frame = (t) => { drawFrame4(ctx, t, images); return true; };

const params = new URLSearchParams(location.search);
if (params.has('t')) window.__frame(parseFloat(params.get('t')));
</script>
</body>
</html>
